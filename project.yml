name: NowPlaying
options:
  bundleIdPrefix: jp.aoiro
  developmentRegion: en
  knownRegions:
    - en
    - ja
    - Base
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.7.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  NowPlaying:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aoiro.nowplaying
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NowPlaying
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/NowPlaying.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.aoiro.nowplaying
    dependencies:
      - target: NowPlayingWidget
        embed: true
  NowPlayingWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.aoiro.nowplaying.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: NowPlaying
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.jp.aoiro.nowplaying
schemes:
  NowPlaying:
    build:
      targets:
        NowPlaying: all
    run:
      config: Release
    archive:
      config: Release
